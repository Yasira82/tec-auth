name: Publish

# Publishes @yasser172/tec-auth to npm on merge to main (version-guarded),
# on a GitHub Release, or via manual dispatch.
# Requires repo secret NPM_TOKEN (npm automation token with publish rights).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/publish.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # NOTE: npm provenance (--provenance + id-token: write) is intentionally NOT
  # used — this source repo is PRIVATE, and npm provenance only supports PUBLIC
  # source repos (422 "Unsupported source repository visibility: private").
  #
  # This workflow DID request id-token and pass --provenance. It has not
  # published since 2026-07-16, so the 422 was never hit: a trap armed for
  # whoever ran the next release, who would have been staring at an
  # authentication-shaped error that had nothing to do with the token.
  #
  # tec-ui and tec-sdk already carried this exact comment — they hit it and
  # learned. This repo never back-adopted the lesson. Re-enable both only if
  # this repo is made public.

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --legacy-peer-deps

      # Gate publish on the same quality bars as CI.
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build   # also runs via prepublishOnly safety net

      - name: Publish
        run: |
          PUBLISHED=$(npm view @yasser172/tec-auth version 2>/dev/null || echo "0.0.0")
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$PUBLISHED" = "$CURRENT" ]; then
            echo "✅ Version $CURRENT already published — skipping"
            exit 0
          fi
          echo "📦 Publishing @yasser172/tec-auth@$CURRENT..."
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
