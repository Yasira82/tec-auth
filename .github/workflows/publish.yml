name: Publish

# Publishes @yasser172/tec-auth to npm when a GitHub Release is published.
# Requires repo secret NPM_TOKEN (npm automation token with publish rights).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance (supply-chain attestation)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --legacy-peer-deps

      # Gate publish on the same quality bars as CI.
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build   # also runs via prepublishOnly safety net

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
