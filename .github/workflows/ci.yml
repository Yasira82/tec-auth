name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main]

# One run per ref. Pushing again to a PR branch cancels the superseded run
# instead of racing it: the last commit is the only one anyone reads, and
# without this every intermediate push paid for a full pipeline — CI's five
# jobs, a CodeQL analysis, a Playwright install-build-and-run — that was
# obsolete before it finished.
#
# `main` is EXCLUDED from cancellation on purpose: a run there is the
# post-merge record (and the status a deploy gate reads). Cancelling those
# would trade money for the one signal worth keeping.
#
# This expression is copied verbatim from `tec-knowledge-base`
# knowledge-ci.yml — the fleet had TWO forms of this rule and the other one
# (tec-app, `cancel-in-progress: true`) cancels main runs as well. One rule,
# one spelling (P2).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (@yasser172/tec-auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck

  test:
    name: Test & Coverage (≥80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - name: Test & Coverage
        run: npm run test   # vitest run --coverage — fails if below the 80% thresholds

  build:
    name: Build (tsup → dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Verify dist output exists
        run: test -f dist/index.js && test -f dist/index.d.ts && echo "dist OK"
